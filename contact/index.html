<!doctype html>
<html lang="en">
  <head>
    <script>
      document.documentElement.classList.add('page-loading')
    </script>
    <style>
      html.page-loading #app {
        opacity: 0;
      }
      @keyframes page-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .page-transition-overlay {
        position: fixed;
        inset: 0;
        z-index: 120000;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        background: rgba(3, 5, 8, 0.38);
        -webkit-backdrop-filter: blur(18px) saturate(1.2);
        backdrop-filter: blur(18px) saturate(1.2);
        opacity: 0;
      }
      .page-transition-spinner {
        width: 42px;
        height: 42px;
        border: 3px solid rgba(0, 245, 232, 0.18);
        border-top-color: #00f5e8;
        border-right-color: rgba(255, 45, 149, 0.65);
        border-radius: 999px;
        animation: page-spin 0.85s linear infinite;
      }
      html.page-loading .page-transition-overlay {
        opacity: 1;
      }
    </style>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#030508" />
    <meta name="description" content="Contact Rao Arcade." />
    <title>Contact — Rao Arcade</title>
  </head>
  <body>
    <div class="page-transition-overlay" aria-hidden="true">
      <div class="page-transition-spinner" role="status" aria-label="Loading page"></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/pages/contact.ts"></script>
  </body>
</html>
